<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ammatara Pura Pool Villas - Resources</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Times New Roman', Times, serif, 'Garamond';
            background-color: #faf6f0;
            color: #2c2520;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .menu-container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(122, 10, 10, 0.08);
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
        }

        /* Ornamental Thai Borders */
        .menu-container::before, .menu-container::after {
            content: "";
            position: absolute;
            left: 15px;
            right: 15px;
            height: 1px;
            background: linear-gradient(to right, transparent, #D4AF37, transparent);
        }
        .menu-container::before { top: 15px; }
        .menu-container::after { bottom: 15px; }

        .logo-wrapper {
            margin-bottom: 25px;
        }

        .logo-img {
            max-width: 220px;
            height: auto;
        }

        .hotel-tagline {
            font-size: 11pt;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #D4AF37;
            margin-bottom: 8px;
            font-weight: 600;
        }

        h1 {
            font-size: 22pt;
            color: #7A0A0A;
            margin-bottom: 12px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .description {
            font-size: 11pt;
            line-height: 1.6;
            color: #5c5249;
            margin-bottom: 35px;
            font-style: italic;
            padding: 0 15px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 14px 24px;
            font-size: 12pt;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-main {
            background-color: #7A0A0A;
            color: #ffffff;
            border: 1px solid #7A0A0A;
        }

        .btn-main:hover {
            background-color: #590707;
            border-color: #590707;
            box-shadow: 0 4px 12px rgba(122, 10, 10, 0.2);
            transform: translateY(-1px);
        }

        .btn-special {
            background-color: transparent;
            color: #7A0A0A;
            border: 1px solid #7A0A0A;
        }

        .btn-special:hover {
            background-color: rgba(122, 10, 10, 0.04);
            box-shadow: 0 4px 12px rgba(122, 10, 10, 0.05);
            transform: translateY(-1px);
        }

        .btn-contract {
            background-color: transparent;
            color: #7A0A0A;
            border: 1px solid #D4AF37;
        }

        .btn-contract:hover {
            background-color: rgba(212, 175, 55, 0.06);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15);
            transform: translateY(-1px);
        }

        .footer-info {
            margin-top: 35px;
            font-size: 9pt;
            color: #8a7e72;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        .footer-info span {
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
